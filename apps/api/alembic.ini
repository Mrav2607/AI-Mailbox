[alembic]
# Use absolute path relative to this file so alembic works no matter where you run from
script_location = %(here)s/alembic
# Set a concrete default; env.py will override with DATABASE_URL if provided
sqlalchemy.url = postgresql+psycopg://user:pass@localhost:5432/cortexmail
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
