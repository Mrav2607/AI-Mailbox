[build-system] 
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexmail-api"
version = "0.1.0"
description = "CortexMail API"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0.28",
  "psycopg[binary]",
  "alembic>=1.13",
  "python-dotenv",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "celery>=5.3",
  "pydantic[email]>=2.0.0",
  # normalizer.py strips HTML email down to text with BeautifulSoup. lxml never
  # appears in an import -- it's named as the parser backend
  # (BeautifulSoup(html, "lxml")), so nothing catches its absence until a real
  # HTML email hits the ingest path at runtime. Keep them together.
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0",
  # Direct dependency: Fernet (config.py, crypto.py) encrypts credentials at
  # rest. Pin to a range that ships prebuilt wheels so pip never falls back to
  # compiling the sdist, which requires a Rust toolchain (maturin) that isn't
  # available locally.
  "cryptography>=42.0,<50",
]

[project.optional-dependencies]
# ruff is pinned: the tree is verified clean against this version, and an
# unpinned CI install broke on 0.16's changed rule behavior (247 findings in
# untouched files). Bump deliberately, fixing what the new version flags.
dev = ["pytest", "ruff==0.15.19", "mypy"]
# Required only for CLASSIFIER_BACKEND=local (in-process fine-tuned encoder).
# Omit to run with the gemini/heuristic backends and a lean image.
local-classifier = ["torch>=2.2", "transformers>=4.40"]
# Required only by scripts/generate_synthetic.py (dev tooling, not the app).
synthetic = ["google-genai>=1.9.0"]

[tool.uvicorn]
factory = false

[tool.setuptools]
packages = ["app"]
