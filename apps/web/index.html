<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CortexMail</title>
    <meta
      name="description"
      content="CortexMail: self-hosted email triage. Your mail sorted into six buckets by your own model, reviewed at keyboard speed."
    />
    <meta property="og:title" content="CortexMail" />
    <meta
      property="og:description"
      content="Self-hosted email triage: your mail sorted into six buckets you review at keyboard speed."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set the theme class before first paint so users never see a flash of
      // the wrong theme. lib/theme.ts owns this logic once the app is running.
      // Dark is the default: only an explicit "light" or "system" preference
      // in storage should produce anything else.
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem("cortexmail_ui") || "{}") || {};
          var dark =
            ui.theme === "light"
              ? false
              : ui.theme === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                : true;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          // Storage read/parse failed — fall back to the dark default rather
          // than leaving the light (unstyled) class in place.
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
